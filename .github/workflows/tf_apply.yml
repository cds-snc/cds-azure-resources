name: "Terraform apply"

on:
  push:
    branches:
      - main
    paths:
      - "terragrunt/**"
      - ".github/workflows/**"
env:
  TERRAFORM_VERSION: 1.9.8
  TERRAGRUNT_VERSION: 0.68.2
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID}}
  ARM_TF_STATE_SUBSCRIPTION_ID: ${{ secrets.ARM_TF_STATE_SUBSCRIPTION_ID}}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  AZURE_RESOURCES_RESOURCE_GROUP_NAME: ${{ secrets.AZURE_RESOURCES_RESOURCE_GROUP_NAME}}
  AZURE_RESOURCES_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_RESOURCES_STORAGE_ACCOUNT_NAME}}
  TF_VAR_sre_email: ${{ secrets.SRE_EMAIL }}
  TF_VAR_security_email: ${{ secrets.SECURITY_EMAIL }}

permissions:
  id-token: write
  contents: read

jobs:
  terragrunt-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform Tools
        uses: cds-snc/terraform-tools-setup@36df0d7572a15921998170395475093c183d720a # v1.3.0

        # Log into Azure
      - name: Azure Login using OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          tenant-id: ${{ env.ARM_TENANT_ID }}
          client-id: ${{ env.ARM_CLIENT_ID }}
          subscription-id: ${{ env.ARM_TF_STATE_SUBSCRIPTION_ID}}

      # cds-snc-mgmt carries a CanNotDelete lock, which also blocks deleting role
      # assignments and child resources such as federated credentials, so any
      # apply that destroys something in that group fails with ScopeLocked.
      # Lift it for the apply and always put it back, as cds-snc/sentinel's
      # apply does. The subscription is CDS-SNC-Management.
      - name: Remove DeleteLock on cds-snc-mgmt
        run: |
          az lock delete --name DeleteLock --resource-group cds-snc-mgmt --subscription 6881deca-df81-4b95-ad54-103b0b100a1d

      - name: Apply Terraform
        working-directory: terragrunt
        env:
          ARM_USE_OIDC: true
        run: |
          terragrunt run-all init --terragrunt-non-interactive
          terragrunt apply --terragrunt-non-interactive -auto-approve

      - name: Restore DeleteLock on cds-snc-mgmt
        if: always()
        run: |
          az lock create --name DeleteLock --lock-type CanNotDelete --resource-group cds-snc-mgmt --subscription 6881deca-df81-4b95-ad54-103b0b100a1d